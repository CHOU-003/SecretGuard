name: DevSecOps CI Pipeline

on:
  push:
    branches: ["main", "devops"]
  pull_request:
    branches: ["main", "devops"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r secret-detector/requirements.txt

      - name: Run Secret Leakage Detection Engine
        run: |
          python secret-detector/main.py --path . --threshold 0.7
