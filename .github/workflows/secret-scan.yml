name: DevSecOps CI Pipeline

# secret-scan chạy ở mọi push/PR vào develop và main.
# deploy chỉ chạy khi push lên main VÀ secret-scan thành công (needs).
# Muốn chặn MERGE khi scan fail: Settings -> Branches -> Branch protection rule cho main/develop
# -> "Require status checks to pass before merging" -> chọn "secret-scan". Việc này cấu hình trên
# GitHub, không nằm trong file này, và là điểm chặn phía server mà --no-verify không vượt qua được.

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # PHẢI trùng phiên bản Python bạn dùng để train model (kiểm tra bằng
          # `venv\Scripts\python.exe --version`). Model pickle gắn với phiên bản thư viện.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: secret-detector/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r secret-detector/requirements.txt

      - name: Check model files
        run: |
          for f in secret-detector/models/secret_ml_model.pkl secret-detector/models/feature_columns.pkl; do
            [ -f "$f" ] || { echo "::error::Thiếu $f. Train, promote rồi commit file model trước."; exit 1; }
          done

      - name: Run Secret Leakage Detection Engine
        env:
          # Để ghi log về dashboard: backend phải truy cập được từ Internet (sau khi deploy lên EC2).
          # Chưa cấu hình thì main.py chỉ in cảnh báo bỏ qua ghi log, KHÔNG làm job fail.
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
        run: python secret-detector/main.py --path . --mode full --trigger-type ci_pipeline --threshold 0.7

  deploy:
    name: deploy
    needs: secret-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tạo environment "production" trong Settings -> Environments và thêm Required reviewers
    # nếu muốn phải bấm duyệt tay trước khi deploy.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Tin khóa host ở lần kết nối đầu mỗi lần chạy (TOFU). Chặt hơn: lưu known_hosts vào secret.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync code to server
        # secret-detector/ không cần trên server (chỉ dùng ở dev và CI). backend/.env và
        # node_modules nằm trên server nên được loại khỏi đồng bộ và không bị --delete xoá.
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'secret-detector/' \
            --exclude 'node_modules/' --exclude 'backend/.env' --exclude 'frontend/dist/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$EC2_USER@$EC2_HOST:/var/www/secret-guard/"

      - name: Build and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/secret-guard/backend
          if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
          cd ../frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          cd ../backend
          pm2 restart secretguard-backend --update-env || pm2 start server.js --name secretguard-backend
          pm2 save
          REMOTE
